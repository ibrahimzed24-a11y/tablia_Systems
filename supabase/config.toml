project_id = "tablia-systems"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = false

[auth]
enabled = true
# Production values go in the Supabase dashboard (Authentication > URL Configuration), see docs/NEEDS-YOUR-ACCESS.md.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/owner", "http://localhost:5173/admin"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Owners create their own account at /owner; staff sign up there with the email their owner invited.
enable_signup = true

[auth.email]
enable_signup = true
# An account works only after the 6-digit code or the link from the email.
enable_confirmations = true
double_confirm_changes = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your Tablia Systems account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Choose a new Tablia Systems password"
content_path = "./supabase/templates/recovery.html"

# /admin requires an authenticator-app code; the database refuses admin data to password-only (aal1) sessions.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true

[functions.paymob-checkout]
verify_jwt = true  # only a signed-in owner starts a payment
import_map = "./functions/paymob-checkout/deno.json"

[functions.paymob-webhook]
verify_jwt = false  # Paymob calls without a Supabase JWT; the function verifies Paymob's HMAC itself
import_map = "./functions/paymob-webhook/deno.json"
