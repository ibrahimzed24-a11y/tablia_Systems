name: CI and deploy

# Every push and pull request runs lint, typecheck and build, plus the database and function tests.
# Deploys never run on push: start them by hand (Actions > CI and deploy > Run workflow) and pick what to deploy,
# after the backup in docs/NEEDS-YOUR-ACCESS.md. Migration 20261029001000 deletes the old pilot data.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'What to deploy after CI passes'
        type: choice
        options: [none, web, supabase, all]
        default: none

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The workflow files are excluded because this step's own pattern would match itself.
      - name: Refuse committed secrets
        run: |
          if git grep -nE "(eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|sk_live_|service_role[\"' ]*[:=][\"' ]*[A-Za-z0-9])" -- ':!*.md' ':!.env.example' ':!.github/workflows/*'; then
            echo "Possible secret committed"; exit 1; fi
      - run: npx turbo run lint typecheck build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # pgTAP suites in supabase/tests against a throwaway local database. Not blocking yet: make it blocking
  # (remove continue-on-error) after its first green run.
  db-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db

  # Deno unit tests of the edge functions. Not blocking yet, same as db-tests.
  function-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/paymob-checkout/index.ts supabase/functions/paymob-webhook/index.ts
      - run: deno test --allow-env --config supabase/functions/paymob-webhook/deno.json supabase/functions/paymob-webhook/

  deploy-vercel:
    needs: ci
    if: github.event_name == 'workflow_dispatch' && (inputs.deploy == 'web' || inputs.deploy == 'all')
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Skip when Vercel secrets are missing
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN not set, skipping deploy"
      - if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@latest
      - if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=$TARGET --token="$VERCEL_TOKEN"
      - if: env.VERCEL_TOKEN != '' && env.TARGET == 'production'
        run: vercel build --prod --token="$VERCEL_TOKEN" && vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - if: env.VERCEL_TOKEN != '' && env.TARGET == 'preview'
        run: vercel build --token="$VERCEL_TOKEN" && vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  # Applies the migrations and deploys the Paymob functions. Run it only after the backup.
  deploy-supabase:
    needs: ci
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.deploy == 'supabase' || inputs.deploy == 'all')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "Supabase secrets not set, skipping migrations and function deploy"
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push --include-all -p "$SUPABASE_DB_PASSWORD"
          supabase functions deploy paymob-checkout --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy paymob-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
